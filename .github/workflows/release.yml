name: DropMedia Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (patch/minor/major). Exact version kullanılırsa yok sayılır."
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major]
      version:
        description: "Tam semver (opsiyonel, örn: 1.2.0)"
        required: false
        type: string
      notes:
        description: "Release notları (boşsa git log kullanılır)"
        required: false
        type: string
      draft:
        description: "Draft olarak oluştur"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Prerelease olarak işaretle"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: dropmedia-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: NSIS kur
        run: choco install nsis -y --no-progress

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Git yapılandır
        run: |
          git config user.name  "dropmedia-release-bot"
          git config user.email "dropmedia-release-bot@users.noreply.github.com"

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}

        run: |
          set -euo pipefail

          TARGET="${{ inputs.version }}"
          if [ -z "$TARGET" ]; then TARGET="${{ inputs.bump }}"; fi

          ARGS=("$TARGET" "--allow-dirty")

          if [ -n "$RELEASE_NOTES" ]; then
            node -e "require('fs').writeFileSync('/tmp/rn.md', process.env.RELEASE_NOTES, 'utf8')"
            ARGS+=("--notes-file" "/tmp/rn.md")
          fi

          [ "${{ inputs.draft }}"      = "true" ] && ARGS+=("--draft")
          [ "${{ inputs.prerelease }}" = "true" ] && ARGS+=("--prerelease")

          node scripts/release.js "${ARGS[@]}"
